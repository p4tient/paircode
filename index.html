<head>
<meta charset="utf-8">

<title>Paircode</title>

<meta name="theme-color" content="#0E1120" media="(prefers-color-scheme: dark)">
<style>
/* Layout: one narrow column under a sticky brand bar; views swap in place; the code "ticket" is the app's hero object. */
:root {
  --bg: #F2F3F7;
  --bar: #F2F3F7;
  --surface: #FFFFFF;
  --ink: #141828;
  --muted: #5B6178;
  --line: #D9DCE6;
  --accent: #2D47D6;
  --accent-soft: #E3E7FB;
  --on-accent: #FFFFFF;
  --ok: #17845A;
  --ok-soft: #DCF2E7;
  --half: #A2660A;
  --half-soft: #F9EDD5;
  --bad: #C43737;
  --bad-soft: #F9E1E1;
  --on-bad: #FFFFFF;
  --warn-bg: #FFF3D1;
  --warn-ink: #4E3B00;
  --warn-line: #EBD48C;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1120; --bar: #0E1120; --surface: #161A2C; --ink: #E9EBF3; --muted: #9BA1B9; --line: #2A3048;
    --accent: #8095FF; --accent-soft: #232C57; --on-accent: #0E1120;
    --ok: #4CC793; --ok-soft: #173A2C; --half: #E2A94A; --half-soft: #3B2F17; --bad: #F07878; --bad-soft: #3F1E22; --on-bad: #1B0A0C;
    --warn-bg: #2F2810; --warn-ink: #F3DF9E; --warn-line: #5A4B1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1120; --bar: #0E1120; --surface: #161A2C; --ink: #E9EBF3; --muted: #9BA1B9; --line: #2A3048;
  --accent: #8095FF; --accent-soft: #232C57; --on-accent: #0E1120;
  --ok: #4CC793; --ok-soft: #173A2C; --half: #E2A94A; --half-soft: #3B2F17; --bad: #F07878; --bad-soft: #3F1E22; --on-bad: #1B0A0C;
  --warn-bg: #2F2810; --warn-ink: #F3DF9E; --warn-line: #5A4B1C;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bar); border-bottom: 1px solid var(--line); }
.bar-row { display: flex; align-items: center; gap: 12px; padding-block: 10px 6px; }
.brand { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 4px 0; cursor: pointer; font: 800 17px/1 var(--display); letter-spacing: -0.01em; }
.langs { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; }
.langs button { border: 0; background: none; padding: 7px 10px; border-radius: 999px; font: 600 12px/1 var(--body); letter-spacing: 0.06em; color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 10px 10px; font: 500 14px/1 var(--body); color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* ---------- Main ---------- */
.main { padding-block: 22px 120px; display: flex; flex-direction: column; gap: 18px; }
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
h1 { font: 600 clamp(26px, 6.4vw, 36px)/1.15 var(--display); letter-spacing: -0.02em; }
h2 { font: 600 22px/1.25 var(--display); letter-spacing: -0.01em; }
h3 { font: 600 16px/1.35 var(--body); }
p { margin: 0; }
.lead { font-size: 17px; color: var(--muted); max-width: 60ch; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 15px; }
.note b { display: block; margin-bottom: 2px; }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.note.calm { background: var(--surface); border: 1px solid var(--line); }
.note .ico { flex: none; font-weight: 700; }
.errors { background: var(--bad-soft); color: var(--ink); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.errors ul { margin: 6px 0 0; padding-left: 18px; }
.errors code { font-family: var(--mono); font-size: 13px; }

/* ---------- Home ---------- */
.hero { display: flex; flex-direction: column; gap: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.steps .num { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 600 14px/1 var(--display); }
.sample { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); width: fit-content; }

/* ---------- Score ---------- */
.score-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.score { font: 800 56px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score span { font-size: 26px; color: var(--muted); margin-left: 2px; }
.score-label { font: 600 13px/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; font-variant-numeric: tabular-nums; }
.count i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.count b { font-weight: 700; }

.strip { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 12px; height: 12px; border-radius: 3px; background: var(--line); }
.cell.imp0 { background: var(--accent); opacity: 0.22; }
.cell.imp1 { background: var(--accent); opacity: 0.5; }
.cell.imp2 { background: var(--accent); opacity: 0.78; }
.cell.imp3 { background: var(--accent); }
.s-ok, .count .s-ok { background: var(--ok); }
.s-half, .count .s-half { background: var(--half); }
.s-bad, .count .s-bad { background: var(--bad); }
.s-deal, .count .s-deal { background: var(--bad); box-shadow: inset 0 0 0 2px var(--ink); }

/* ---------- Quiz ---------- */
.pack { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.pack > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
.pack > summary::-webkit-details-marker { display: none; }
.pack > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-left: 4px; margin-top: -4px; }
.pack[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
.pack-title { font: 600 15px/1.2 var(--display); flex: 1; min-width: 0; }
.pack-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pack-body { display: flex; flex-direction: column; border-top: 1px solid var(--line); }

.q { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q.is-on { background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
.q-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.q-text { min-width: 0; }
.badge { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.q-note { font-size: 13px; color: var(--muted); margin-top: -6px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-size: 15px; line-height: 1.25; cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips.sm .chip { padding: 6px 11px; font-size: 14px; }
.chips.sm .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chips.sm .chip[aria-pressed="true"]::before { content: "✓ "; color: var(--accent); font-weight: 700; }

.sub { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
.sub-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; font-size: 14px; border-radius: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button.deal[aria-pressed="true"] { background: var(--bad); color: var(--on-bad); border-color: var(--bad); }
.q-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.skipped { font-size: 13px; color: var(--muted); }

.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.modes button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pack-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
.pack-note { padding: 12px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.talk { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.talk-title { font: 600 14px/1.25 var(--display); }
.talk ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.talk li { font-weight: 600; }
.talk li span { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }

.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.rank-pct { font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.rank-main { min-width: 0; }
.rank-label { font-weight: 600; overflow-wrap: anywhere; }
.res-img { width: 100%; max-width: 420px; border-radius: 14px; border: 1px solid var(--line); display: block; }
.foot .actions { gap: 8px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bar); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.dock-count { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Review / inside lists ---------- */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.rv { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.rv:last-child { border-bottom: 0; }
.rv-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.rv-q { font-size: 14px; color: var(--muted); }
.rv-a { font-weight: 600; }
.rv-meta { font-size: 13px; color: var(--muted); }

/* ---------- Code ticket ---------- */
.ticket { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.ticket-top, .ticket-bottom { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.ticket-bottom { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 16px; }
.ticket-bottom p { flex: 1 1 180px; min-width: 0; }
.perf { position: relative; height: 0; margin: 0 22px; border-top: 2px dashed var(--line); }
.perf::before, .perf::after { content: ""; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { left: -34px; }
.perf::after { right: -34px; }
.code { font: 600 18px/1.55 var(--mono); letter-spacing: 0.03em; word-break: break-all; user-select: all; -webkit-user-select: all; }
.qr-box { background: #FFFFFF; border-radius: 10px; line-height: 0; flex: none; }
.qr-box img { width: 168px; height: 168px; image-rendering: pixelated; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field textarea, .field input { width: 100%; font: 500 15px/1.45 var(--mono); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; }
.hint { font-size: 13px; color: var(--muted); }

/* ---------- Compare result ---------- */
.result { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.section-title { font: 600 14px/1.2 var(--display); display: flex; align-items: center; gap: 8px; }
.section-title i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ci-list { display: flex; flex-direction: column; }
.ci { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ci-q { font-weight: 600; }
.ci-rows { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: baseline; font-size: 15px; }
.ci-who { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.ci-ans { min-width: 0; }
.mark { font-weight: 700; }
.mark.yes { color: var(--ok); }
.mark.no { color: var(--bad); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
details.okset > summary { cursor: pointer; list-style: none; }
details.okset > summary::-webkit-details-marker { display: none; }

/* ---------- Footer / toast ---------- */
.foot { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.how > summary { cursor: pointer; font-weight: 600; }
.how p { margin-top: 8px; color: var(--muted); font-size: 15px; max-width: 62ch; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: no-preference) {
  .chip, .seg button, .btn { transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap bar-row">
    <button class="brand" id="brand" type="button" data-go="home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="13" height="13" rx="3.5" fill="var(--accent)"/><rect x="8" y="8" width="13" height="13" rx="3.5" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>
      <span>Paircode</span>
    </button>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs"></nav></div>
</header>

<main class="wrap main">
  <div id="dataErrors" class="errors" hidden></div>
  <section id="v-home" class="view"></section>
  <section id="v-quiz" class="view" hidden></section>
  <section id="v-review" class="view" hidden></section>
  <section id="v-code" class="view" hidden></section>
  <section id="v-compare" class="view" hidden></section>
  <footer id="foot" class="foot"></footer>
</main>

<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="qrcode.js"></script>
<script src="questions.js"></script>
<script>
(function () {
'use strict';

/* ================= Settings ================= */
var REPO_URL = 'https://github.com/p4tient/paircode'; // the footer links to questions.js here

var LANGS = ['uk', 'pl', 'en'];
var LANG_LABEL = { uk: 'UA', pl: 'PL', en: 'EN' };
var STORE = { lang: 'paircode.lang', draft: 'paircode.draft', code: 'paircode.code', mode: 'paircode.mode' };

/* ================= Interface text ================= */
var UI = {
  en: {
    navQuestions: 'Questions', navMyCode: 'My code', navCompare: 'Compare',
    heroTitle: 'Compare before you meet.',
    heroLead: "Answer the questions you're comfortable with, get a short code, and post it. Anyone can compare their code with yours, question by question. Both people see the same result.",
    step1: 'Answer what you want. Every question can be skipped.',
    step2: 'Get your code and link.',
    step3: "Post it and compare with anyone's code.",
    start: 'Start', cont: 'Continue · {n} answered', compareCodes: 'Compare codes',
    privacyTitle: 'Nothing is collected',
    privacyBody: "There's no server and no account. Your answers stay in this browser until you share the code yourself.",

    exampleLabel: 'Example',

    howBody: "For each question you both answered, you score points when their answer is one you accept, weighted by how much it matters to you (a little 1, a lot 10, dealbreaker 100, doesn't matter 0). They score the same way against your answers. The match is the geometric mean of both sides, so it's only high when it works for both. Dealbreakers are always listed separately. If someone picked several answers, one acceptable answer is enough.",
    footerOpen: 'Open source. Every question is readable in',
    footerCount: '{n} questions.',
    errData: 'questions.js has problems:', errLoad: "Couldn't load questions.js. It has to sit next to index.html.",
    quizHint: 'Tap your answer, then tick the partner answers that are fine with you and how much it matters.',
    you: 'You', acceptLabel: "Partner answers you'd accept", impLabel: 'How much it matters',
    imp: ["Doesn't matter", 'A little', 'A lot', 'Dealbreaker'],
    skip: 'Skip', skipped: 'Skipped', sensitive: 'Sensitive', sensitiveNote: 'Think twice: your code is public.',
    answered: '{n} answered', review: 'Review',
    reviewTitle: 'These answers will be public',
    reviewSub: "Anyone with your code can read them. Remove anything you're unsure about.",

/* ================= Code format =================
   v1: [1][N = highest answered id][bitmap of ids 1..N][one byte per answered id][CRC-8]
       answer byte: bits 7-6 my option, bits 5-2 accepted partner options, bits 1-0 importance
   v2, used only when someone picked several own answers somewhere:
       [2][N][bitmap of ids 1..N][bitmap over the answered ids, 1 = several own answers][answers][CRC-8]
       one own answer: one byte as in v1; several: two bytes, (my options << 4 | importance), then accepted options
   text: base62 (letters and digits only, so a long-press selects the whole code) */

}

}
function crc8(bytes) {

    c ^= b;
    for (var i = 0; i < 8; i++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff;

}
function encode(map) {

  var N = ids.length ? ids[ids.length - 1] : 0;
  var multi = ids.map(function (id) { return bitCount(map.get(id).m & 15) > 1; });
  var v2 = multi.some(Boolean);
  var bytes = [v2 ? 2 : 1, N];
  var bm = new Array(Math.ceil(N / 8)).fill(0);
  ids.forEach(function (id) { bm[(id - 1) >> 3] |= 1 << ((id - 1) & 7); });
  bytes = bytes.concat(bm);
  if (v2) {
    var mb = new Array(Math.ceil(ids.length / 8)).fill(0);
    multi.forEach(function (on, k) { if (on) mb[k >> 3] |= 1 << (k & 7); });
    bytes = bytes.concat(mb);
  }
  ids.forEach(function (id, k) {
    var r = map.get(id);
    if (multi[k]) bytes.push(((r.m & 15) << 4) | (r.imp & 3), r.acc & 15);
    else bytes.push(((lowBit(r.m) & 3) << 6) | ((r.acc & 15) << 2) | (r.imp & 3));

}
function decode(str) {

  var crc = bytes.pop();
  if (crc8(bytes) !== crc) return { err: 'invalid' };

/* Accepts a bare code, a share link, or a whole pasted post. */
function parseCode(input) {
  var s = String(input || '').trim();

  var h = s.lastIndexOf('#');
  if (h >= 0) { var m = s.slice(h + 1).match(/^[0-9A-Za-z]+/); if (m) cands.push(m[0]); }

  for (var i = 0; i < cands.length; i++) {

/* ================= Scoring ================= */
function compareMaps(A, B) {
  var items = [], eA = 0, pA = 0, eB = 0, pB = 0, unknown = 0;
  var skippedByB = [], skippedByA = [];
  var ids = new Set(Array.from(A.keys()).concat(Array.from(B.keys())));
  ids.forEach(function (id) {
    var q = QBY.get(id), a = A.get(id), b = B.get(id);
    if (!q) { unknown++; return; }
    if (q.retired) return;
    var n = nOpts(q);
    var full = (1 << n) - 1;
    if ((a && (!a.m || (a.m & ~full))) || (b && (!b.m || (b.m & ~full)))) { unknown++; return; }
    if (a && b) {
      var aAccepts = !!(a.acc & b.m);   // one acceptable answer is enough
      var bAccepts = !!(b.acc & a.m);
      var wa = WEIGHTS[a.imp], wb = WEIGHTS[b.imp];
      pA += wa; if (aAccepts) eA += wa;
      pB += wb; if (bAccepts) eB += wb;
      var dealA = a.imp === 3 && !aAccepts, dealB = b.imp === 3 && !bAccepts;
      var status = (dealA || dealB) ? 'deal' : (aAccepts && bAccepts) ? 'ok' : (aAccepts || bAccepts) ? 'half' : 'bad';
      items.push({ q: q, a: a, b: b, aAccepts: aAccepts, bAccepts: bAccepts, dealA: dealA, dealB: dealB, status: status });
    } else if (a && a.imp === 3) skippedByB.push(q);
    else if (b && b.imp === 3) skippedByA.push(q);
  });
  var sA = pA ? eA / pA : 1, sB = pB ? eB / pB : 1;
  return { items: items, n: items.length, score: Math.sqrt(sA * sB), sA: sA, sB: sB, skippedByA: skippedByA, skippedByB: skippedByB, unknown: unknown };
}

/* Finds every valid code in pasted text (a Threads comment section, a list of links...).

var NOT_NAMES = ['reply', 'replies', 'translate', 'author', 'follow', 'like', 'likes', 'repost', 'share', 'top', 'view', 'activity', 'more', 'edited', 'pinned'];
function extractCodes(text) {
  var lines = String(text || '').split(/\r?\n/);

    var cands = [], m, re = /#([0-9A-Za-z]+)/g;
    while ((m = re.exec(line))) cands.push(m[1]);
    (line.match(/[0-9A-Za-z]{6,}/g) || []).forEach(function (x) { cands.push(x); });
    cands.forEach(function (c) {
      if (found.has(c)) return;
      var d = decode(c);
      if (!d.map) return;
      var label = '';
      for (var k = li; k >= Math.max(0, li - 4) && !label; k--) {
        var u = lines[k].trim().match(/^@?([a-z0-9._]{3,30})$/);
        if (u && /[a-z]/.test(u[1]) && !/^\d+[smhdw]$/.test(u[1]) && NOT_NAMES.indexOf(u[1]) < 0) label = '@' + u[1];
      }
      found.set(c, { code: c, map: d.map, label: label });
    });
  });
  return Array.from(found.values());
}
function runMany() {

  cmp.mineCode = A.code;
  var found = extractCodes(cmp.manyText).filter(function (f) { return f.code !== A.code; });
  if (!found.length) { cmp.error = t('manyNone'); return; }
  function key(e) { return e.res.n >= MIN_SHARED ? e.res.score : -1; }
  cmp.many = found.map(function (f) { return { code: f.code, label: f.label, res: compareMaps(A.map, f.map) }; })
    .sort(function (x, y) { return key(y) - key(x) || y.res.n - x.res.n; });
}

/* ---------- Result image (drawn locally on a canvas, no answers shown) ---------- */
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function makeResultImage(res) {
  var ready = (document.fonts && document.fonts.load)
    ? Promise.all(['800 100px "Unbounded"', '600 30px "Onest"', '400 30px "Onest"'].map(function (f) { return document.fonts.load(f); })).catch(function () {})
    : Promise.resolve();
  return ready.then(function () {
    var W = 1080, H = 1080, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var g = cv.getContext('2d');
    var C = { bg: '#F2F3F7', card: '#FFFFFF', ink: '#141828', muted: '#5B6178', accent: '#2D47D6', ok: '#17845A', half: '#A2660A', bad: '#C43737' };
    var D = '"Unbounded", "Onest", system-ui, sans-serif', B = '"Onest", system-ui, sans-serif';
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    roundRect(g, 60, 60, W - 120, H - 120, 48); g.fillStyle = C.card; g.fill();
    var u = 3, lx = 120, ly = 120;
    roundRect(g, lx + u, ly + u, 13 * u, 13 * u, 3.5 * u); g.fillStyle = C.accent; g.fill();
    roundRect(g, lx + 8 * u, ly + 8 * u, 13 * u, 13 * u, 3.5 * u); g.lineWidth = 2 * u; g.strokeStyle = C.ink; g.stroke();
    g.textBaseline = 'middle'; g.fillStyle = C.ink; g.font = '800 40px ' + D; g.fillText('Paircode', lx + 22 * u + 20, ly + 11 * u);
    g.textBaseline = 'alphabetic';
    var pct = String(Math.round(res.score * 100));
    g.font = '800 240px ' + D; g.fillStyle = C.ink; g.fillText(pct, 112, 460);
    var pw = g.measureText(pct).width;
    g.font = '800 96px ' + D; g.fillStyle = C.muted; g.fillText('%', 112 + pw + 14, 460);
    g.font = '600 30px ' + B; g.fillStyle = C.muted; g.fillText(t('matchLabel').toUpperCase(), 120, 530);
    g.font = '400 36px ' + B; g.fillStyle = C.ink; g.fillText(t('comparedOn', { n: res.n }), 120, 580);
    var order = displayOrder();
    var col = { ok: C.ok, half: C.half, bad: C.bad, deal: C.bad };
    var cs = 34, gap = 10, x = 120, y = 630;
    res.items.slice().sort(function (a, b) { return order.get(a.q.id) - order.get(b.q.id); }).forEach(function (it) {
      if (x + cs > W - 120) { x = 120; y += cs + gap; }
      roundRect(g, x, y, cs, cs, 8); g.fillStyle = col[it.status]; g.fill();
      if (it.status === 'deal') { roundRect(g, x + 3, y + 3, cs - 6, cs - 6, 6); g.lineWidth = 5; g.strokeStyle = C.ink; g.stroke(); }
      x += cs + gap;
    });
    var c = { ok: 0, half: 0, bad: 0, deal: 0 };
    res.items.forEach(function (it) { c[it.status]++; });
    var cy = Math.max(y + cs + 70, 820);

    return cv.toDataURL('image/png');
  });
}

/* ---------- Copy + toast ---------- */
var toastTimer = null;
function toast(msg) {
  var el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}
function selectFallback(el) {
  if (!el) return;
  if (el.select) { el.focus(); el.select(); return; }
  var range = document.createRange(); range.selectNodeContents(el);
  var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
}
function legacyCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function copy(text, fallbackEl) {
  var fail = function () { if (legacyCopy(text)) { toast(t('copied')); return; } selectFallback(fallbackEl); toast(t('copyFail')); };
  try {
    var p = navigator.clipboard && navigator.clipboard.writeText(text);
    if (p && p.then) p.then(function () { toast(t('copied')); }, fail); else fail();
  } catch (e) { fail(); }
}

/* ================= Events ================= */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('button, a');
  if (!el) return;
  if (el.dataset.lang) { lang = el.dataset.lang; storeSet(STORE.lang, lang); render(); return; }
  if (el.dataset.go) { show(el.dataset.go); return; }
  var act = el.dataset.act; if (!act) return;
  if (act === 'ans' || act === 'acc' || act === 'imp' || act === 'skip') { onQuizAction(el); return; }
  if (act === 'mode') { quizMode = el.dataset.mode === 'all' ? 'all' : 'quick'; storeSet(STORE.mode, quizMode); show('quiz'); return; }
  if (act === 'hotpost') {
    var hq = QBY.get(+el.closest('.q').dataset.id), mine = myCode();
    copy(mine ? t('hotPostCode', { q: qText(hq), link: shareLink(mine) }) : t('hotPost', { q: qText(hq), link: baseLink() }));
    return;
  }
  if (act === 'rm') { answers.delete(+el.dataset.id); saveDraft(); renderReview(); return; }
  if (act === 'create') {
    var pub = publicAnswers(); if (!pub.size) return;
    var code = encode(pub); memCode = code; storeSet(STORE.code, code); cmp.mine = code; show('code'); return;
  }
  if (act === 'copy-code') { copy(myCode(), $('#codeText')); return; }
  if (act === 'copy-link') { copy(shareLink(myCode()), $('#linkField')); return; }
  if (act === 'copy-post') { copy($('#postField').value, $('#postField')); return; }
  if (act === 'edit') {
    if (!answers.size) {
      var d = decode(myCode());
      if (d.map) d.map.forEach(function (r, id) { var q = QBY.get(id); if (q && !q.retired && r.m && !(r.m >> nOpts(q))) answers.set(id, { m: r.m, acc: r.acc, imp: r.imp, t: true }); });
      saveDraft();
    }
    show('quiz'); return;
  }
  if (act === 'cmp') { runCompare(); renderCompare(); return; }
  if (act === 'cmpview') { cmp.view = el.dataset.view === 'many' ? 'many' : 'one'; cmp.error = ''; renderCompare(); return; }
  if (act === 'many') { runMany(); renderCompare(); return; }
  if (act === 'many-open') {
    cmp.view = 'one'; cmp.theirs = el.dataset.code; runCompare(); renderCompare();
    var rr = $('#v-compare .result'); if (rr && rr.scrollIntoView) rr.scrollIntoView({ block: 'start' });
    return;
  }
  if (act === 'copy-result' && cmp.result) {
    copy(t('resultText', { pct: Math.round(cmp.result.score * 100), n: cmp.result.n, link: shareLink(cmp.mineCode) }));
    return;
  }
  if (act === 'make-image' && cmp.result) {
    makeResultImage(cmp.result).then(function (url) {
      var box = $('#resImg');
      if (box) box.innerHTML = '<img class="res-img" alt="' + esc(t('matchLabel')) + ' ' + Math.round(cmp.result.score * 100) + '%" src="' + url + '"><p class="hint">' + esc(t('imageHint')) + '</p>';
    });
    return;
  }
  if (act === 'install' && installEvt) {
    var ev2 = installEvt; installEvt = null;
    try { ev2.prompt(); } catch (e) { /* ignore */ }
    renderChrome();
    return;
  }
  if (act === 'inside') { runInside(); renderCompare(); return; }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'theirs') cmp.theirs = ev.target.value;
  if (ev.target.id === 'mine') cmp.mine = ev.target.value;
